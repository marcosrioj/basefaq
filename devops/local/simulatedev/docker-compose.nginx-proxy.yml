services:
  querify.local.nginx:
    image: nginx:1.27-alpine
    container_name: querify-local-nginx-proxy
    restart: unless-stopped
    init: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./runtime/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - qf-network

networks:
  qf-network:
    external: true
    name: qf-network
