services:
  querify.qna.portal.api:
    image: querify.qna.portal.api
    restart: unless-stopped
    build:
      context: ../../..
      dockerfile: dotnet/Querify.QnA.Portal.Api/Dockerfile
    ports:
      - "5010:5010"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5010
      ConnectionStrings__TenantDb: "Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${TENANT_DATABASE:-qf_tenant_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-Pass123$};"
      Redis__Host: ${REDIS_HOST:-cache}
      Redis__Port: ${REDIS_PORT:-6379}
      Redis__Password: ${REDIS_PASSWORD:-RedisTempPassword}
      RabbitMQ__Hostname: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMQ__Port: ${RABBITMQ_PORT:-5672}
      RabbitMQ__Username: ${RABBITMQ_USERNAME:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
      ObjectStorage__Endpoint: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      ObjectStorage__PublicEndpoint: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:-http://localhost:5900}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - qf-network
